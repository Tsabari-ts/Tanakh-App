<div dir="auto"></div>

<app-skip-link></app-skip-link>

@if (notifications.current(); as notification) {
  <div class="app-toast" [class.app-toast--error]="notification.type === 'error'" role="alert" aria-live="assertive">
    <span>{{ notification.text }}</span>
    <button type="button" class="app-toast__dismiss" (click)="notifications.dismiss()" i18n-aria-label="@@app.dismissNotification" aria-label="סגירת הודעה">×</button>
  </div>
}

@if (appUpdate.updateAvailable()) {
  <div class="update-banner" role="status">
    <span i18n="@@app.updateAvailable">יש גרסה חדשה של האפליקציה</span>
    <button type="button" (click)="appUpdate.applyUpdate()" i18n="@@app.refreshNow">רענן עכשיו</button>
  </div>
}

<div class="container app-shell">
  <header class="title" role="banner">
    @if (showButton()) {
      <button class="btn btn-icon tk-hit header-icon-btn" type="button" (click)="goBack()" i18n-aria-label="@@app.back" aria-label="חזרה">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    }
    <p class="site-name" i18n="@@app.title">פרק תנ"ך ביום</p>
    <button class="btn btn-icon tk-hit header-icon-btn" type="button" (click)="goSettings()" i18n-aria-label="@@app.settings" aria-label="הגדרות">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <footer class="main-footer" role="contentinfo">
    <h4 i18n="@@app.footer">בשם ה' נעשה ונצליח</h4>
    <div class="footer-links">
      <button type="button" class="accessibility-statement-link" (click)="openStatement()" i18n="@@a11yStatement.footerLink">הצהרת נגישות</button>
      <button type="button" class="accessibility-statement-link" (click)="openTerms()" i18n="@@terms.footerLink">תנאי שימוש</button>
    </div>
    <hr class="hr-footer">
    <a class="footer-credit" [href]="whatsappContactUrl" target="_blank" rel="noopener" i18n="@@app.footerCredit">נבנה ועוצב על ידי Tomer - By Your Site</a>
  </footer>

  <app-cookie-banner></app-cookie-banner>

  <div class="img-background" aria-hidden="true"></div>

  <main id="main-content" tabindex="-1">
    @if (errorState.state().kind === 'none') {
      <router-outlet></router-outlet>
    } @else {
      <app-error-screen></app-error-screen>
    }
  </main>
</div>

<app-accessibility-widget></app-accessibility-widget>
