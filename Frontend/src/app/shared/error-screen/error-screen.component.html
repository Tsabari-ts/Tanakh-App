@if (errorState.state(); as state) {
  @if (state.kind === 'fatal') {
    <div class="error-screen" dir="rtl" lang="he" role="alert">
      <h1 i18n="@@errorScreen.fatalTitle">משהו השתבש</h1>
      <p i18n="@@errorScreen.fatalMessage">אירעה שגיאה בלתי צפויה באפליקציה. ניתן לנסות שוב או לחזור לדף הבית.</p>
      <div class="error-screen__actions">
        <button type="button" (click)="reload()" i18n="@@errorScreen.tryAgain">נסה שוב</button>
        <button type="button" (click)="backToHome()" i18n="@@chapter.backToHome">חזרה לדף הבית</button>
      </div>
    </div>
  } @else if (state.kind === 'reload') {
    <div class="error-screen" dir="rtl" lang="he" role="alert">
      <h1 i18n="@@errorScreen.reloadTitle">עדכון זמין</h1>
      <p>{{ state.message }}</p>
      <div class="error-screen__actions">
        <button type="button" (click)="reload()" i18n="@@app.refreshNow">רענן עכשיו</button>
      </div>
    </div>
  }
}
