<div class="legal-modal dialog dialog-pop">
  <!-- No role="dialog"/aria-modal/cdkTrapFocus here: MatDialogContainer
       (from legal-dialog.service.ts's dialog.open call) already provides
       the dialog role, aria-modal, focus trap, and Escape-to-close for the
       whole component - adding them again here would nest a second
       "dialog" landmark inside the first one. -->
  <header class="legal-modal__head dialog-head">
    <div class="dialog-head__icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        @for (path of data.iconPaths; track path) {
          <path [attr.d]="path" />
        }
      </svg>
    </div>
    <div class="dialog-head__text">
      <h2 class="dialog-head__title" mat-dialog-title id="legal-modal-title">{{ data.title }}</h2>
    </div>
    <button type="button" class="btn btn-icon tk-hit" [attr.aria-label]="'סגירת ' + data.title" (click)="close()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="legal-modal__body dialog-body tk-scroll" mat-dialog-content tabindex="0" role="region" [attr.aria-label]="'תוכן ' + data.title" [innerHTML]="safeHtml"></div>

  <footer class="legal-modal__foot dialog-actions" mat-dialog-actions>
    <button type="button" class="btn btn-secondary tk-hit" (click)="print()" i18n="@@legal.print">הדפסה</button>
    <button type="button" class="btn btn-primary tk-hit" (click)="close()" i18n="@@legal.closeButton">סגירה</button>
  </footer>
</div>
