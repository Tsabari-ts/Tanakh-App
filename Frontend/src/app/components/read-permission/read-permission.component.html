<div >
  @if (userHasConfirmedReading) {
    <div class="loader-background">
      <div class="welcome-body dialog dialog-pop">
        <header class="dialog-head">
          <div class="dialog-head__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="dialog-head__text">
            <div class="dialog-head__kicker" i18n="@@readPermission.kicker">מעקב קריאה</div>
            <h2 class="dialog-head__title" mat-dialog-title i18n="@@readPermission.title">אישור קריאת הפרק</h2>
          </div>
          <button class="btn btn-icon tk-hit" type="button" (click)="closeDialog()" i18n-aria-label="@@dialog.close" aria-label="סגירה">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </header>
        <div mat-dialog-content class="dialog-body">
          <b i18n="@@readPermission.congrats">כל הכבוד זכית בעוד פרק</b>
          <p id="read-permission-saving" i18n="@@readPermission.saving">מתבצעת שמירה...</p>
          <br>
            <div class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                 [attr.aria-valuenow]="progressValue() > 100 ? 100 : progressValue()"
                 aria-describedby="read-permission-saving">
              <div class="progress-bar" [style.width.%]="progressValue()"></div>
            </div>
          </div>
        </div>
      </div>
    } @else {
      <div class="welcome-body dialog dialog-pop">
        <header class="dialog-head">
          <div class="dialog-head__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="dialog-head__text">
            <div class="dialog-head__kicker" i18n="@@readPermission.kicker">מעקב קריאה</div>
            <h2 class="dialog-head__title" mat-dialog-title i18n="@@readPermission.title">אישור קריאת הפרק</h2>
          </div>
          <button class="btn btn-icon tk-hit" type="button" (click)="closeDialog()" i18n-aria-label="@@dialog.close" aria-label="סגירה">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </header>
        <div mat-dialog-content class="dialog-body">
          <b i18n="@@readPermission.confirmPrompt1">לחיצה על אישור תגרום לשמירת הפרק כפרק האחרון שקראת.</b>
          <br>
            <b i18n="@@readPermission.confirmPrompt2">האם לשמור את הפרק?</b>
            <br><br>
            <div mat-dialog-actions class="dialog-actions">
              <button class="btn btn-primary btn-block tk-hit" type="button" (click)="saveAndClose()" [disabled]="isButtonDisabled()" i18n="@@readPermission.save">שמירת הפרק</button>
            </div>
            @if (isSavedInProgress()) {
              <div class="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                   [attr.aria-valuenow]="progressValue() > 100 ? 100 : progressValue()"
                   i18n-aria-label="@@readPermission.saving" aria-label="מתבצעת שמירה">
                <div class="progress-bar" [style.width.%]="progressValue()"></div>
              </div>
            }
            @if (isSavedSuccessful()) {
              <div role="status">
                <span class="serverResponse" i18n="@@readPermission.saved">הפרק נשמר בהצלחה</span>
              </div>
            }
          </div>
        </div>
      }
    </div>
