
<div class="centered-container">
  @if (chapters) {
    <div class="button-row">
      @for (versesNumber of chapters; track $index; let chapterNumber = $index) {
        <div>
          <button class="chapter-button" (click)="goToChapter(chapterNumber + 1)">
            פרק {{ getChapterName(chapterNumber + 1) }} ({{ versesNumber }})
          </button>
        </div>
      }
    </div>
  }
</div>
