
<div class="centered-container" #contentContainer>

  @if (loadError()) {
    <div class="empty-state">
      <h1 class="visually-hidden" i18n="@@chapter.loadErrorHeading">שגיאה בטעינת הפרק</h1>
      <p i18n="@@chapter.loadError">אירעה שגיאה בטעינת הפרק. ייתכן שהפרק אינו קיים.</p>
      <button class="end-button" type="button" (click)="returnToHomePage()" i18n="@@chapter.backToHome">חזרה לדף הבית</button>
    </div>
  } @else {
    <h1 class="tittle">
      {{title()}}
    </h1>
    @if (data(); as verses) {
      <div>
        <p class="sentences">
          @for (verse of verses; track $index) {
            <span class="verse" [id]="'verse-' + $index">{{ verse }}</span>{{ ' ' }}
          }
          <br>
            <button class="end-button" type="button" (click)="finishedReading()" i18n="@@chapter.finishedReading">סיימתי לקרוא</button>
          </p>
        </div>
      }

      <div id="floatingDiv">
        <button class="svg-button" type="button" (click)="scrollDown()">
          <span class="hide-text" i18n="@@chapter.scrollDown">למטה</span>
          <div class="icon" [ngClass]="downIcon" aria-hidden="true"></div>
        </button>
        <button class="svg-button" type="button" (click)="stopScrolling()">
          <span class="hide-text" i18n="@@chapter.stop">עצור</span>
          <div class="icon" [ngClass]="stopIcon" aria-hidden="true"></div>
        </button>
        <button class="svg-button" type="button" (click)="scrollUp()">
          <span class="hide-text" i18n="@@chapter.scrollUp">למעלה</span>
          <div class="icon" [ngClass]="upIcon" aria-hidden="true"></div>
        </button>
        <button class="svg-button" type="button" (click)="GetNextChapter()">
          <span class="hide-text" i18n="@@chapter.nextChapter">פרק הבא</span>
          <div class="icon" [ngClass]="nextIcon" aria-hidden="true"></div>
        </button>
      </div>
  }
</div>

<app-scroll-to-top-button [contentContainer]="contentContainer"></app-scroll-to-top-button>
