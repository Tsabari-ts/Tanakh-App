<div class="tk-screen tk-scroll centered-container home-screen">
  <div>
    <div class="home-greeting">{{ greeting }}</div>
    <h1 class="home-title" i18n="@@home.title">הפרק היומי שלך</h1>
  </div>

  <div class="hero-card elev-md">
    <div class="hero-card__blob" aria-hidden="true"></div>
    <div class="hero-card__content">
      <div class="hero-card__kicker" i18n="@@home.continueFrom">המשך מהמקום שהפסקת</div>
      <div class="hero-card__label">{{ lastLabel() }}</div>
      <div class="hero-card__snippet">{{ lastSnippet }}</div>
      <button type="button" class="btn tk-hit hero-card__cta" (click)="continueReading()">
        <span i18n="@@home.continueReading">המשך קריאה</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="card elev-sm stat-card">
      <div class="stat-card__value stat-card__value--accent">{{ readTotal() }}</div>
      <div class="text-muted stat-card__label" i18n="@@home.readTotal">פרקים שסימנת כנקראו</div>
    </div>
    <div class="card elev-sm stat-card">
      <div class="stat-card__value stat-card__value--accent-2">{{ streak() }}</div>
      <div class="text-muted stat-card__label" i18n="@@home.streak">ימי רצף קריאה</div>
    </div>
  </div>

  <button type="button" class="tk-hit browse-row" (click)="openBooks()">
    <div class="browse-row__icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </div>
    <div class="browse-row__text">
      <div class="browse-row__title" i18n="@@home.browseAll">עיון בכל התנ״ך</div>
      <div class="text-muted browse-row__sub" i18n="@@home.browseAllSub">תורה · נביאים · כתובים — 39 ספרים</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" class="browse-row__chevron"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>
