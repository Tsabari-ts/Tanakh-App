
  <div class="centered-container">
    <h1 class="visually-hidden" i18n="@@settings.heading">הגדרות</h1>
    <div class="button-row">
          <button class="svg-button" type="button" (click)="contactUs()">
            <div class="icon" [ngClass]="contactUsIcon" aria-hidden="true"></div>
            {{ contactUsButton }}
          </button>
          <button class="svg-button" type="button" (click)="downloadApp()" [disabled]="pwaInstall.isStandalone()">
            <div class="icon" [ngClass]="downloadAppIcon" aria-hidden="true"></div>
            {{ downloadAppButton() }}
          </button>
          <button class="svg-button" type="button" (click)="openSubscribe()">
            <div class="icon" [ngClass]="subscribeIcon" aria-hidden="true"></div>
            {{ subscribeButton() }}
          </button>
      </div>
      @if (pwaInstall.isIos() && !pwaInstall.isStandalone()) {
        <p class="ios-install-hint" i18n="@@settings.iosInstallHint">
          להתקנת האפליקציה: לחצו על כפתור השיתוף בדפדפן ובחרו "הוספה למסך הבית".
        </p>
      }
  </div>
