<div class="centered-container">
  @if (loadError()) {
    <p class="empty-state">אירעה שגיאה בטעינת רשימת הספרים. נסה שוב מאוחר יותר.</p>
  } @else {
    <div class="button-row">
      @for (item of data(); track item.title) {
        <button class="books-button" (click)="goTo(item)">
          {{ item.heTitle }}
        </button>
      } @empty {
        <p class="empty-state">לא נמצאו ספרים</p>
      }
    </div>
  }
</div>
