<div class="admin-shell">
  <header class="admin-shell__header">
    <h1>לוח ניהול</h1>

    <div class="admin-shell__range">
      @for (preset of presets; track preset.id) {
        <button
          type="button"
          [class.active]="dateRange.preset() === preset.id"
          (click)="setPreset(preset.id)">
          {{ preset.label }}
        </button>
      }
      <button type="button" class="admin-shell__refresh" (click)="refresh()" title="רענון">⟳</button>
    </div>

    <button type="button" class="admin-shell__theme" (click)="theme.toggle()">
      {{ theme.isDark() ? 'מצב בהיר' : 'מצב כהה' }}
    </button>

    <button type="button" class="admin-shell__logout" (click)="logout()">התנתקות</button>
  </header>

  <nav class="admin-shell__nav">
    <a routerLink="overview" routerLinkActive="active">סקירה כללית</a>
    <a routerLink="users" routerLinkActive="active">משתמשים</a>
    <a routerLink="sms" routerLinkActive="active">SMS</a>
    <a routerLink="logs" routerLinkActive="active">לוגים</a>
    <a routerLink="system" routerLinkActive="active">מערכת</a>
  </nav>

  <main class="admin-shell__content">
    <router-outlet />
  </main>
</div>
