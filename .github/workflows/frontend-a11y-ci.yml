name: Frontend Accessibility CI

on:
  push:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-a11y-ci.yml"
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-a11y-ci.yml"

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stylelint (outline:none, !important, px-on-font-size guard)
        run: npm run lint:css

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # These routes and dialogs render without the .NET backend (or degrade
      # to an accessible error state if it isn't running) - see e2e/a11y.spec.ts.
      - name: axe-core accessibility suite
        run: npm run e2e:a11y
        env:
          CI: true

      - name: Lighthouse accessibility budget
        run: npm run lighthouse:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 7
